# Checks every pull request and push to main using the shared workflows in
# picklemypaddle-infra (SCRUM-13/15). On main, the image job publishes
# :staging and :<sha>; home-server pulls :staging.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: thehunfromoz/picklemypaddle-infra/.github/workflows/node-checks.yml@main
    with:
      # SCRUM-72: test:e2e walks an order through the admin in Chromium (desktop and phone sizes).
      scripts: typecheck test build test:e2e
      playwright: true
      report-path: playwright-report

  secrets:
    uses: thehunfromoz/picklemypaddle-infra/.github/workflows/secret-scan.yml@main

  image:
    needs: [checks, secrets]
    uses: thehunfromoz/picklemypaddle-infra/.github/workflows/image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      container-test: ci/container-test.sh
      # SCRUM-64: the container test also runs the test suite against a real Postgres 18 beside
      # the image, and makes its test photo with sharp, so it needs the project's dependencies.
      setup-node: true
